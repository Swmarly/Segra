name: Sync official Segra

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
      timezone: "Europe/Oslo"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Fetch official upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/Segergren/Segra.git
          git fetch --no-tags upstream main

      - name: Apply only new upstream changes safely
        id: apply
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          write_conflict_report() {
            local reason="$1"
            local files="$2"

            {
              echo "# Upstream sync requires manual conflict resolution"
              echo
              echo "The automated sync did not create or update a pull request because the merge was not clean."
              echo
              echo "Reason: $reason"
              echo
              echo "Affected files:"
              printf '%s\n' "$files"
              echo
              echo "The upstream source is:"
              echo "https://github.com/Segergren/Segra"
              echo
              echo "The custom OBS download workflow was preserved. No files were pushed to main."
            } > upstream-conflict-report.md

            git diff --cc --binary > upstream-conflicts.patch || true
            git reset --hard HEAD

            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          }

          upstream_sha="$(git rev-parse upstream/main)"
          sync_base="$(tr -d '[:space:]' < .github/upstream-sync-base || true)"

          if [ -z "$sync_base" ]; then
            write_conflict_report "The upstream sync baseline file is missing or empty." ".github/upstream-sync-base"
            exit 0
          fi

          if ! git cat-file -e "$sync_base^{commit}" 2>/dev/null; then
            write_conflict_report "The recorded upstream baseline is not available in the fetched history." ".github/upstream-sync-base"
            exit 0
          fi

          if [ "$sync_base" = "$upstream_sha" ]; then
            echo "Official upstream is already synchronized at $upstream_sha."
          else
            echo "Applying upstream changes from $sync_base to $upstream_sha."

            git diff --binary --no-renames "$sync_base" "$upstream_sha" > upstream-changes.patch

            if ! git apply --3way --index upstream-changes.patch; then
              conflict_files="$(git diff --name-only --diff-filter=U || true)"

              if [ -z "$conflict_files" ]; then
                conflict_files="$(git status --short || true)"
              fi

              write_conflict_report "New upstream changes overlap with local custom changes." "$conflict_files"
              exit 0
            fi
          fi

          # Always preserve the fork's custom Git LFS/storage configuration.
          git restore --source=HEAD -- .gitattributes

          # Never allow literal conflict markers into a pull request.
          marker_files="$(git grep -l -I -E '^(<<<<<<<|=======|>>>>>>>)' -- . || true)"

          if [ -n "$marker_files" ]; then
            write_conflict_report "Conflict markers were found in the merged working tree." "$marker_files"
            exit 0
          fi

          # Never reintroduce upstream OBS archives or Git LFS pointer files.
          git ls-files -z -- 'Obs/*.zip' 'Obs/*.tar.gz' |
            xargs -0 -r git rm -f --

          # Verify the custom download workflow still exists.
          if [ ! -f scripts/Download-ObsBundle.ps1 ]; then
            write_conflict_report "scripts/Download-ObsBundle.ps1 is missing after the upstream sync." "scripts/Download-ObsBundle.ps1"
            exit 0
          fi

          # Record exactly which upstream commit has now been incorporated.
          printf '%s\n' "$upstream_sha" > .github/upstream-sync-base

          git add -A

          # Check again after staging, before the PR action sees the workspace.
          unresolved="$(git diff --cached --name-only --diff-filter=U || true)"

          if [ -n "$unresolved" ]; then
            write_conflict_report "Unresolved files remained after staging." "$unresolved"
            exit 0
          fi

          marker_files="$(git grep -l -I -E '^(<<<<<<<|=======|>>>>>>>)' -- . || true)"

          if [ -n "$marker_files" ]; then
            write_conflict_report "Conflict markers were found in the staged result." "$marker_files"
            exit 0
          fi

          echo "conflict=false" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "Already up to date: no upstream changes found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected:"
            git diff --cached --stat
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload conflict report
        if: steps.apply.outputs.conflict == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-conflict-report
          path: |
            upstream-conflict-report.md
            upstream-conflicts.patch
          if-no-files-found: error
          retention-days: 30

      - name: Report conflicts in workflow summary
        if: steps.apply.outputs.conflict == 'true'
        shell: bash
        run: |
          {
            echo "## Upstream sync requires manual conflict resolution"
            echo
            echo "No pull request was created because new upstream changes conflict with local custom changes."
            echo
            echo "The affected files and generated patch are available in the workflow artifact:"
            echo "**upstream-sync-conflict-report**"
            echo
            echo "Download the artifact, resolve the listed files locally, test the result, and push the resolved changes to main."
            echo
            echo "The custom OBS download workflow was preserved and no changes were pushed to main by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Conflict report uploaded. No pull request was created."

      - name: Create upstream sync pull request
        if: steps.apply.outputs.conflict != 'true' && steps.apply.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/upstream-sync
          base: main
          delete-branch: true
          title: "Sync with official Segra"
          commit-message: "chore: sync with official upstream"
          body: |
            Automated sync from:

            https://github.com/Segergren/Segra

            The sync preserves the custom OBS download workflow and excludes
            upstream OBS archive files managed through broken Git LFS objects.
